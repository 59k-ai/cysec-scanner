name: ci-gates

# LIB-04 blocking CI gates (CI-gate-as-contract). Every job here MUST redden the
# pipeline on failure: NONE of them carries an allow-failure / failure-suppression
# escape hatch. These gates stand up the keystone invariants — static
# cross-platform binaries, the go 1.26.0 directive floor, a license-clean module
# graph, a name-clean public tree, no inbound listening socket in the engine, no
# reachable known vulnerability and the local IPC legs on Windows, macOS and
# Linux-as-root — BEFORE any external module pins and imports the public
# API, so a regression reddens rather than ships. Modelled on governance.yml
# (same triggers, runner, no escape hatch). Every action is pinned by full
# commit SHA, every setup-go step builds on Go 1.27.x with check-latest, and
# the default token is read-only.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  # Gate 1 — static cross-compile matrix (LIB-04, threat T-9-11).
  # Proves the engine builds as a fully static binary on EVERY shipped
  # OS/arch target with CGO_ENABLED=0 and NO C toolchain. A cgo regression
  # (an `import "C"` or a cgo-only dependency) would need a C compiler and
  # reddens the affected matrix leg. CC is pinned to a non-existent compiler as
  # belt-and-suspenders: CGO_ENABLED=0 already prevents any C-toolchain
  # invocation, but if cgo were ever accidentally re-enabled the build fails
  # loudly for want of a C compiler, literally satisfying the "no-C-compiler
  # runner" contract even though ubuntu-latest ships gcc. fail-fast is off so
  # every target leg builds independently and one failure cannot mask another.
  cross-compile:
    name: static cross-compile (CGO_ENABLED=0, no C compiler)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: "Static build ${{ matrix.goos }}/${{ matrix.goarch }} (no cgo, no C compiler)"
        env:
          CGO_ENABLED: "0"
          CC: cc-does-not-exist
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags='-s -w' ./...

  # Gate 2 — go-1.26 directive assertion (LIB-04, threat T-9-SC).
  # go.mod and tests/consumer/go.mod must declare EXACTLY `go 1.26.0`: the
  # minimum is the oldest supported Go line, written in the tidy-stable form
  # (every current dependency declares `go 1.26.0`, so `go mod tidy` would
  # rewrite a bare `go 1.26` and redden the tidy gate). There is NO `toolchain`
  # line: the CI Go is chosen by setup-go, not by go.mod, and a toolchain line
  # would make builds silently download a toolchain and duplicate the CI pin.
  # Raised from go 1.22 on 2026-11-01 after an external security review
  # (F1/F2: unsupported stdlib, unpatched x/* dependencies). Reddens if either
  # directive is not exactly `go 1.26.0`, or if any toolchain line is present.
  go-directive:
    name: go-1.26 directive pin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert go.mod files declare exactly 'go 1.26.0' and no toolchain line
        run: |
          for f in go.mod tests/consumer/go.mod; do
            grep -qxE 'go 1\.26\.0' "$f" || { echo "$f does not declare exactly 'go 1.26.0'"; exit 1; }
            if grep -qE '^toolchain' "$f"; then
              echo "$f carries a toolchain line; CI selects the toolchain"
              exit 1
            fi
          done
          echo "GO126_PINNED"

  # Gate 3 — dependency-license gate (LIB-04, threat T-9-SC).
  # Reddens if ANY forbidden/restricted (copyleft/OEM) license appears in the Go
  # module graph, for both the host OS and GOOS=windows. go-licenses is PINNED
  # by commit SHA (v1.6.0), never @latest —
  # it is a CI dev tool, not a shipped dependency. Copied from governance.yml's
  # licenses job (same pinned SHA + same --disallowed_types set). No
  # failure-suppression: a forbidden dependency MUST redden the pipeline.
  licenses:
    name: dependency license gate (go-licenses)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Install go-licenses (pinned by commit SHA; Apache-2.0)
        run: go install github.com/google/go-licenses@5348b744d0983d85713295ea08a20cca1654a45e

      - name: Resolve module graph
        run: go mod download

      - name: "go-licenses check (disallowed: forbidden, restricted)"
        run: go-licenses check ./... --disallowed_types=forbidden,restricted

      # Windows-only modules (go-winio, linked by the ipc package on Windows)
      # are invisible to a linux-host pass, so the check runs again for
      # GOOS=windows.
      - name: "go-licenses check for GOOS=windows (Windows-only modules)"
        run: GOOS=windows go-licenses check ./... --disallowed_types=forbidden,restricted

  # Gate 4 — library build + test + out-of-module consumer proof (LIB-02).
  # Builds and tests the whole module, then drives the out-of-module consumer
  # (a separate Go module that imports only the public packages and runs the
  # engine with no proprietary knowledge). Reddens if the public import contract
  # or any in-tree test regresses. The race step runs the event-emitting packages
  # under -race (cgo on; ubuntu ships gcc) to guard the D-26 emitter mutex.
  library:
    name: library build + test + consumer proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Build module
        run: go build ./...

      - name: Test module
        run: go test ./...

      - name: Race test (detailed events, D-26 emitter mutex)
        run: go test -race ./scanner/... ./progress/... ./internal/scanstate/... ./internal/netutil/... ./internal/discovery/... ./internal/portscan/... ./internal/fingerprint/...

      - name: Out-of-module consumer test
        run: cd tests/consumer && go test ./...

  # Gate 5 — leak-guard identifier denylist (LIB-04, threat T-9-09).
  # Reddens if ANY private identifier (token list in
  # .github/leak-guard-denylist.txt) appears in a scanned file — source, docs,
  # config, workflows, or golden fixtures (D-10). The scan is case-insensitive
  # over the whole tracked tree MINUS three exclusions that would otherwise make
  # the gate self-invalidating or false-positive:
  #   - data/oui and data/recog: embedded third-party vendor/fingerprint data
  #     that legitimately contains common English words inside vendor street
  #     addresses (e.g. a vendor whose address names a dock or waterfront); the
  #     denylist anchors otherwise-common tokens to a hostname form to avoid
  #     matching such words, and these trees are excluded as belt-and-suspenders.
  #   - .github/leak-guard-denylist.txt itself: it necessarily contains every
  #     token it searches for, so scanning it would always self-match.
  # The legitimate public name `cysec-scanner` is NOT a denylist token and must
  # never match. No failure-suppression: any real leak reddens the pipeline.
  leak-guard:
    name: leak-guard identifier denylist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Grep tracked tree for private identifiers
        run: |
          FILES=$(git ls-files -- ':!data/oui' ':!data/recog' ':!.github/leak-guard-denylist.txt')
          MATCH=$(printf '%s\n' "$FILES" | xargs grep -niE -f .github/leak-guard-denylist.txt 2>/dev/null || true)
          if [ -n "$MATCH" ]; then
            echo "leak-guard: private identifier found in a scanned file:"
            printf '%s\n' "$MATCH"
            exit 1
          fi
          echo "LEAKGUARD_CLEAN"

  # Gate 6 — ENG-04 no-inbound-socket grep (LIB-04 / LIB-06, threat T-9-10).
  # The read-only engine must open NO inbound/listening socket under any stage
  # ordering. The gate greps every shipped non-test Go source (git ls-files
  # '*.go' minus *_test.go and minus the out-of-module tests/consumer tree) for
  # EVERY listener constructor form — net.Listen(/ListenTCP/ListenUDP/
  # ListenIP/ListenPacket/ListenUnix/ListenMulticastUDP/FileListener/
  # ListenConfig, icmp.ListenPacket, http.ListenAndServe, the ListenAndServe(TLS)
  # method and http.Server literals, http.Serve(, tls.Listen/tls.NewListener,
  # the httptest and nettest loopback servers, the raw listen and bind
  # wrappers (syscall, x/sys/unix, x/sys/windows), the named-pipe and Hyper-V
  # listeners ListenPipe, ListenHvsock and CreateNamedPipe, and the public
  # ipc.Listen( (full list in tests/ci/eng04.sh) — and
  # then SUBTRACTS an EXPLICIT file+construct allowlist of pinned sites
  # (exemption by enumeration, never by dropping a constructor from the
  # pattern):
  #   - icmp.ListenPacket in internal/capabilities/capabilities.go and
  #     net.ListenUDP in internal/netutil/mdns.go: the two OUTBOUND client/probe
  #     datagrams (ICMP capability probe; mDNS reverse-query client on an
  #     ephemeral port), never a listening service.
  #   - net.ListenUnix in ipc/listen_unix.go and winio.ListenPipe in
  #     ipc/listen_windows.go: the local IPC endpoint. It is a filesystem socket
  #     or a named pipe with an explicit ACL, built for a SEPARATE host binary
  #     that controls the engine; it is never TCP, UDP or HTTP, and the engine
  #     itself never links the ipc package (Gate 6b below).
  #   - ipc.Listen( in tools/ipc-refhost/main.go: the reference host the
  #     client tests run against.
  # The pattern and allowlist live in tests/ci/eng04.sh so the local negative
  # controls (tests/ci/ipc_gates_test.sh) exercise the same text. Any hit NOT
  # on the allowlist reddens the job, and so does a pinned site that vanished
  # (a stale entry would otherwise exempt a future file of the same name). No
  # failure-suppression.
  no-inbound-socket:
    name: ENG-04 no-inbound-socket grep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The negative controls include the import-graph check, which needs Go.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Assert no listener constructor outside the pinned-site allowlist
        run: bash tests/ci/eng04.sh eng04_scan "$GITHUB_WORKSPACE"

      - name: Assert every pinned listener site still exists (non-vacuous)
        run: bash tests/ci/eng04.sh eng04_targets_exist "$GITHUB_WORKSPACE"

      - name: Run the local negative controls for the listener gate
        run: bash tests/ci/ipc_gates_test.sh

  # Gate 6b — engine import graph (LIB-06, threat T-12-39).
  # The engine binary and library (cmd/cysec-scanner, scanner/...) must never
  # link the ipc package or go-winio on any shipped OS: the local IPC endpoint
  # belongs to a separate host binary, so the engine keeps its no-listener
  # property by construction, not only by grep. Runs `go list -deps` for
  # GOOS=linux, darwin and windows and reddens on either import (or on a
  # go list failure). No failure-suppression.
  ipc-import-graph:
    name: engine import graph excludes ipc and go-winio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Assert cmd/cysec-scanner and scanner/... never link ipc or go-winio
        run: bash tests/ci/eng04.sh ipc_import_graph "$GITHUB_WORKSPACE"

  # Gate 7 — APOST-01 relocated-code residue grep (threat T-10-11).
  # Authenticated posture checks are not part of this open engine. This gate is
  # DISTINCT from leak-guard: leak-guard stops private identifiers leaking IN;
  # this one proves no relocated authenticated-posture code, and none of the
  # remote-management / directory / Kerberos dependency names it pulled in,
  # survives in the public tree. The token list lives in
  # .github/apost-01-tokens.txt (one case-insensitive pattern per line) so this
  # workflow file carries no literal token. It scans every tracked Go source
  # plus every go.mod / go.sum (a stale go.sum line counts as residue), minus
  # data/recog and data/oui: embedded third-party fingerprint/vendor data whose
  # unrelated English/vendor strings are not engine code. Deletion is physical,
  # never a build tag or dead-code guard, so any hit reddens the pipeline. No
  # failure-suppression.
  apost-01:
    name: APOST-01 relocated-code residue grep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert zero relocated-code tokens in tracked Go sources and module files
        run: |
          TOKENS=.github/apost-01-tokens.txt
          test -s "$TOKENS" || { echo "APOST-01 token list missing or empty"; exit 1; }
          git ls-files --error-unmatch go.mod go.sum >/dev/null || { echo "go.mod/go.sum not tracked; scan would be vacuous"; exit 1; }
          set +e
          MATCH=$(git grep -niE -f "$TOKENS" -- '*.go' 'go.mod' 'go.sum' '*/go.mod' '*/go.sum' ':!data/recog' ':!data/oui')
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "APOST-01: relocated-code residue found in the public tree:"
            printf '%s\n' "$MATCH"
            exit 1
          fi
          if [ "$RC" -ne 1 ]; then
            echo "APOST-01: git grep failed (exit $RC)"
            exit 1
          fi
          echo "APOST01_CLEAN"

  # Gate 8 — module-graph tidy-clean assertion (APOST-01, threat T-10-11).
  # After code is removed, `go mod tidy` must already have been run and
  # committed: a dependency (or go.sum hash) that only the removed code needed
  # would otherwise linger in the published module graph. Runs tidy on the CI
  # Go 1.27.x toolchain and reddens if go.mod or go.sum changes.
  go-mod-tidy:
    name: go.mod / go.sum tidy-clean
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Assert go mod tidy produces no drift
        run: |
          go mod tidy
          DRIFT=$(git status --porcelain go.mod go.sum)
          if [ -n "$DRIFT" ]; then
            echo "go.mod/go.sum are not tidy (commit the output of go mod tidy):"
            printf '%s\n' "$DRIFT"
            git diff -- go.mod go.sum
            exit 1
          fi
          echo "GOMOD_TIDY_CLEAN"

  # Gate 9 — govulncheck reachable-vulnerability scan (F1/F2).
  # Scans the module with the SAME toolchain that builds the release (setup-go
  # Go 1.27.x + check-latest), so standard-library CVEs in the shipped Go are
  # visible alongside dependency CVEs; a scan on an old pinned toolchain could
  # not show them. Default source mode: exit 3 on any vulnerability reachable
  # from the code reddens the job. GOOS is a matrix because x/sys and stdlib
  # vulnerabilities can be OS-specific. govulncheck is pinned by version
  # (v1.9.0), never @latest. No failure-suppression.
  govulncheck:
    name: govulncheck (reachable vulns, CI Go)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Install govulncheck (pinned v1.9.0)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Show toolchain
        run: go version

      - name: "govulncheck ./... (GOOS=${{ matrix.goos }})"
        env:
          GOOS: ${{ matrix.goos }}
        run: govulncheck ./...

  # Gates 10-12 — local IPC legs as hard gates (threat T-12-40).
  # The ipc package's Windows and root-only tests skip when their precondition
  # is missing, which would let a job turn green without testing anything. Each
  # job below therefore (a) sets the require-env variable that turns those skips
  # into failures, (b) writes the `go test -v` output to a file and checks the
  # go test exit status before reading it, so no pipe can mask a failure, and
  # (c) runs tests/ci/check_test_log.sh, which demands a named PASS line for
  # every sentinel test and fails on any SKIP line. No failure-suppression.

  # Gate 10 — Windows named-pipe leg: pipe ACL, first-instance protection,
  # remote-client refusal, administrator and restricted-token peers, the
  # impersonation thread discipline and the end-to-end host over a real pipe.
  ipc-windows:
    name: IPC tests on Windows (named pipe, hard gate)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      CYSEC_REQUIRE_IPC_WINDOWS: "1"
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: go vet ./ipc/...
        run: go vet ./ipc/...

      - name: go test ./ipc/... (CYSEC_REQUIRE_IPC_WINDOWS=1)
        run: |
          st=0
          go test ./ipc/... -count=1 -v > ipc-test.log 2>&1 || st=$?
          cat ipc-test.log
          test "$st" -eq 0

      - name: Assert Windows sentinels passed and no "--- SKIP" line
        run: >-
          bash tests/ci/check_test_log.sh ipc-test.log
          TestHelloRequiredFirst TestHelloWrongToken TestPipeListen
          TestPipeFirstInstance TestPipeSDDL TestPipeRejectRemote
          TestPeerWindowsAdmin TestPeerWindowsRestrictedRefused
          TestImpersonationThreadDiscipline TestHostEndToEnd

  # Gate 11 — macOS local-socket leg: the explicit macOS validation of AF_UNIX
  # plus LOCAL_PEERCRED. The unprivileged run proves the path policy, the
  # same-user and admin-group peers (the runner user is an administrator) and
  # the end-to-end host; the root-only cases are excluded there by -skip and
  # then run under sudo with CYSEC_REQUIRE_IPC_ROOT=1, so a peer outside the
  # admin group (nobody) is proven refused. No SKIP is accepted in either run.
  ipc-macos:
    name: IPC tests on macOS (AF_UNIX + LOCAL_PEERCRED, hard gate)
    runs-on: macos-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: go test ./ipc/... (unprivileged, root-only cases excluded)
        run: |
          st=0
          go test ./ipc/... -count=1 -v -skip 'TestPeerNonAdmin|TestUnixPathPolicy/existingRootRoot0750' > ipc-test.log 2>&1 || st=$?
          cat ipc-test.log
          test "$st" -eq 0

      - name: Assert unprivileged macOS sentinels passed and no "--- SKIP" line
        run: >-
          bash tests/ci/check_test_log.sh ipc-test.log
          TestListenUnix TestUnixPathPolicy TestPeerSameUser
          TestPeerAdminGroup TestHostEndToEnd

      - name: go test TestPeerNonAdmin as root (CYSEC_REQUIRE_IPC_ROOT=1)
        run: |
          st=0
          sudo -E env "PATH=$PATH" CYSEC_REQUIRE_IPC_ROOT=1 go test ./ipc/ -run 'TestPeerNonAdmin' -count=1 -v > ipc-root-test.log 2>&1 || st=$?
          cat ipc-root-test.log
          test "$st" -eq 0

      - name: Assert the macOS root sentinel passed and no "--- SKIP" line
        run: bash tests/ci/check_test_log.sh ipc-root-test.log TestPeerNonAdmin

  # Gate 12 — Linux root leg: SO_PEERCRED plus the raw supplementary-group
  # read, the non-admin refusal and the systemd-style root:root 0750 runtime
  # directory normalised to the admin group. These cases need root, so they
  # run under sudo with CYSEC_REQUIRE_IPC_ROOT=1; the unprivileged Linux pass is
  # the library job's `go test ./...`.
  ipc-linux-root:
    name: IPC tests on Linux as root (peer credentials, hard gate)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: go test peer and path-policy tests as root (CYSEC_REQUIRE_IPC_ROOT=1)
        run: |
          st=0
          sudo -E env "PATH=$PATH" CYSEC_REQUIRE_IPC_ROOT=1 go test ./ipc/ -run 'TestPeer|TestLinuxPeerGroups|TestUnixPathPolicy|TestListenUnix' -count=1 -v > ipc-root-test.log 2>&1 || st=$?
          cat ipc-root-test.log
          test "$st" -eq 0

      - name: Assert Linux root sentinels passed and no "--- SKIP" line
        run: >-
          bash tests/ci/check_test_log.sh ipc-root-test.log
          TestPeerNonAdmin TestLinuxPeerGroups
          TestUnixPathPolicy/existingRootRoot0750
