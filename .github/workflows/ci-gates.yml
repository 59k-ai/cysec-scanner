name: ci-gates

# LIB-04 blocking CI gates (CI-gate-as-contract). Every job here MUST redden the
# pipeline on failure: NONE of them carries an allow-failure / failure-suppression
# escape hatch. These gates stand up the keystone invariants — static
# cross-platform binaries, the go 1.26.0 directive floor, a license-clean module
# graph, a name-clean public tree, no inbound listening socket and no reachable
# known vulnerability — BEFORE any external module pins and imports the public
# API, so a regression reddens rather than ships. Modelled on governance.yml
# (same triggers, runner, no escape hatch). Every action is pinned by full
# commit SHA, every setup-go step builds on Go 1.27.x with check-latest, and
# the default token is read-only.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  # Gate 1 — static cross-compile matrix (LIB-04, threat T-9-11).
  # Proves the engine builds as a fully static binary on EVERY shipped
  # OS/arch target with CGO_ENABLED=0 and NO C toolchain. A cgo regression
  # (an `import "C"` or a cgo-only dependency) would need a C compiler and
  # reddens the affected matrix leg. CC is pinned to a non-existent compiler as
  # belt-and-suspenders: CGO_ENABLED=0 already prevents any C-toolchain
  # invocation, but if cgo were ever accidentally re-enabled the build fails
  # loudly for want of a C compiler, literally satisfying the "no-C-compiler
  # runner" contract even though ubuntu-latest ships gcc. fail-fast is off so
  # every target leg builds independently and one failure cannot mask another.
  cross-compile:
    name: static cross-compile (CGO_ENABLED=0, no C compiler)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: "Static build ${{ matrix.goos }}/${{ matrix.goarch }} (no cgo, no C compiler)"
        env:
          CGO_ENABLED: "0"
          CC: cc-does-not-exist
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags='-s -w' ./...

  # Gate 2 — go-1.26 directive assertion (LIB-04, threat T-9-SC).
  # go.mod and tests/consumer/go.mod must declare EXACTLY `go 1.26.0`: the
  # minimum is the oldest supported Go line, written in the tidy-stable form
  # (every current dependency declares `go 1.26.0`, so `go mod tidy` would
  # rewrite a bare `go 1.26` and redden the tidy gate). There is NO `toolchain`
  # line: the CI Go is chosen by setup-go, not by go.mod, and a toolchain line
  # would make builds silently download a toolchain and duplicate the CI pin.
  # Raised from go 1.22 on 2026-11-01 after an external security review
  # (F1/F2: unsupported stdlib, unpatched x/* dependencies). Reddens if either
  # directive is not exactly `go 1.26.0`, or if any toolchain line is present.
  go-directive:
    name: go-1.26 directive pin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert go.mod files declare exactly 'go 1.26.0' and no toolchain line
        run: |
          for f in go.mod tests/consumer/go.mod; do
            grep -qxE 'go 1\.26\.0' "$f" || { echo "$f does not declare exactly 'go 1.26.0'"; exit 1; }
            if grep -qE '^toolchain' "$f"; then
              echo "$f carries a toolchain line; CI selects the toolchain"
              exit 1
            fi
          done
          echo "GO126_PINNED"

  # Gate 3 — dependency-license gate (LIB-04, threat T-9-SC).
  # Reddens if ANY forbidden/restricted (copyleft/OEM) license appears in the Go
  # module graph. go-licenses is PINNED by commit SHA (v1.6.0), never @latest —
  # it is a CI dev tool, not a shipped dependency. Copied from governance.yml's
  # licenses job (same pinned SHA + same --disallowed_types set). No
  # failure-suppression: a forbidden dependency MUST redden the pipeline.
  licenses:
    name: dependency license gate (go-licenses)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Install go-licenses (pinned by commit SHA; Apache-2.0)
        run: go install github.com/google/go-licenses@5348b744d0983d85713295ea08a20cca1654a45e

      - name: Resolve module graph
        run: go mod download

      - name: "go-licenses check (disallowed: forbidden, restricted)"
        run: go-licenses check ./... --disallowed_types=forbidden,restricted

  # Gate 4 — library build + test + out-of-module consumer proof (LIB-02).
  # Builds and tests the whole module, then drives the out-of-module consumer
  # (a separate Go module that imports only the public packages and runs the
  # engine with no proprietary knowledge). Reddens if the public import contract
  # or any in-tree test regresses. The race step runs the event-emitting packages
  # under -race (cgo on; ubuntu ships gcc) to guard the D-26 emitter mutex.
  library:
    name: library build + test + consumer proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Build module
        run: go build ./...

      - name: Test module
        run: go test ./...

      - name: Race test (detailed events, D-26 emitter mutex)
        run: go test -race ./scanner/... ./progress/... ./internal/scanstate/... ./internal/netutil/... ./internal/discovery/... ./internal/portscan/... ./internal/fingerprint/...

      - name: Out-of-module consumer test
        run: cd tests/consumer && go test ./...

  # Gate 5 — leak-guard identifier denylist (LIB-04, threat T-9-09).
  # Reddens if ANY private identifier (token list in
  # .github/leak-guard-denylist.txt) appears in a scanned file — source, docs,
  # config, workflows, or golden fixtures (D-10). The scan is case-insensitive
  # over the whole tracked tree MINUS three exclusions that would otherwise make
  # the gate self-invalidating or false-positive:
  #   - data/oui and data/recog: embedded third-party vendor/fingerprint data
  #     that legitimately contains common English words inside vendor street
  #     addresses (e.g. a vendor whose address names a dock or waterfront); the
  #     denylist anchors otherwise-common tokens to a hostname form to avoid
  #     matching such words, and these trees are excluded as belt-and-suspenders.
  #   - .github/leak-guard-denylist.txt itself: it necessarily contains every
  #     token it searches for, so scanning it would always self-match.
  # The legitimate public name `cysec-scanner` is NOT a denylist token and must
  # never match. No failure-suppression: any real leak reddens the pipeline.
  leak-guard:
    name: leak-guard identifier denylist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Grep tracked tree for private identifiers
        run: |
          FILES=$(git ls-files -- ':!data/oui' ':!data/recog' ':!.github/leak-guard-denylist.txt')
          MATCH=$(printf '%s\n' "$FILES" | xargs grep -niE -f .github/leak-guard-denylist.txt 2>/dev/null || true)
          if [ -n "$MATCH" ]; then
            echo "leak-guard: private identifier found in a scanned file:"
            printf '%s\n' "$MATCH"
            exit 1
          fi
          echo "LEAKGUARD_CLEAN"

  # Gate 6 — ENG-04 no-inbound-socket grep (LIB-04 / LIB-06, threat T-9-10).
  # The read-only engine must open NO inbound/listening socket under any stage
  # ordering. This greps every shipped non-test Go source (git ls-files '*.go'
  # minus *_test.go and minus the out-of-module tests/consumer tree) for EVERY
  # inbound-listener constructor form — net.Listen(/ListenTCP/ListenUDP/
  # ListenPacket/ListenUnix/ListenMulticastUDP/FileListener/ListenConfig,
  # icmp.ListenPacket, http.ListenAndServe, http.Serve( — NOT only TCP/HTTP, so
  # a new inbound UDP/unix/packet/multicast listener cannot pass silently. It
  # then SUBTRACTS an EXPLICIT file+construct allowlist of EXACTLY the two
  # legitimate OUTBOUND client/probe sockets (exemption by enumeration, never by
  # dropping a constructor from the pattern):
  #   - icmp.ListenPacket in internal/capabilities/capabilities.go — the
  #     unprivileged ICMP capability PROBE: an outbound datagram opened then
  #     immediately closed, never an inbound server.
  #   - net.ListenUDP in internal/netutil/mdns.go — the mDNS reverse-query
  #     CLIENT datagram bound to an ephemeral Port: 0 (outbound), never a
  #     listening service.
  # Any listener-constructor hit NOT on that two-entry allowlist — or a second
  # occurrence in a non-allowlisted file — reddens the job. No
  # failure-suppression.
  no-inbound-socket:
    name: ENG-04 no-inbound-socket grep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert no inbound listening socket outside the two-site allowlist
        run: |
          FILES=$(git ls-files '*.go' -- ':!*_test.go' ':!tests/consumer')
          HITS=$(printf '%s\n' "$FILES" | xargs grep -nE 'net\.Listen\(|net\.ListenTCP|net\.ListenUDP|net\.ListenPacket|net\.ListenUnix|net\.ListenMulticastUDP|net\.FileListener|net\.ListenConfig|icmp\.ListenPacket|http\.ListenAndServe|http\.Serve\(' 2>/dev/null || true)
          FILTERED=$(printf '%s\n' "$HITS" | grep -vE 'internal/capabilities/capabilities\.go:[0-9]+:.*icmp\.ListenPacket|internal/netutil/mdns\.go:[0-9]+:.*net\.ListenUDP' 2>/dev/null | grep -vE '^$' || true)
          if [ -n "$FILTERED" ]; then
            echo "ENG-04: inbound listener constructor outside the two-site allowlist:"
            printf '%s\n' "$FILTERED"
            exit 1
          fi
          echo "NO_INBOUND_SOCKET"

      - name: Assert the two allowlisted client-socket sites still exist (non-vacuous)
        run: |
          FILES=$(git ls-files '*.go' -- ':!*_test.go')
          HITS=$(printf '%s\n' "$FILES" | xargs grep -nE 'icmp\.ListenPacket|net\.ListenUDP' 2>/dev/null || true)
          printf '%s\n' "$HITS" | grep -qE 'internal/capabilities/capabilities\.go:[0-9]+:.*icmp\.ListenPacket' || { echo "allowlisted icmp.ListenPacket site vanished"; exit 1; }
          printf '%s\n' "$HITS" | grep -qE 'internal/netutil/mdns\.go:[0-9]+:.*net\.ListenUDP' || { echo "allowlisted net.ListenUDP site vanished"; exit 1; }
          echo "ALLOWLIST_TARGETS_EXIST"

  # Gate 7 — APOST-01 relocated-code residue grep (threat T-10-11).
  # Authenticated posture checks are not part of this open engine. This gate is
  # DISTINCT from leak-guard: leak-guard stops private identifiers leaking IN;
  # this one proves no relocated authenticated-posture code, and none of the
  # remote-management / directory / Kerberos dependency names it pulled in,
  # survives in the public tree. The token list lives in
  # .github/apost-01-tokens.txt (one case-insensitive pattern per line) so this
  # workflow file carries no literal token. It scans every tracked Go source
  # plus every go.mod / go.sum (a stale go.sum line counts as residue), minus
  # data/recog and data/oui: embedded third-party fingerprint/vendor data whose
  # unrelated English/vendor strings are not engine code. Deletion is physical,
  # never a build tag or dead-code guard, so any hit reddens the pipeline. No
  # failure-suppression.
  apost-01:
    name: APOST-01 relocated-code residue grep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert zero relocated-code tokens in tracked Go sources and module files
        run: |
          TOKENS=.github/apost-01-tokens.txt
          test -s "$TOKENS" || { echo "APOST-01 token list missing or empty"; exit 1; }
          git ls-files --error-unmatch go.mod go.sum >/dev/null || { echo "go.mod/go.sum not tracked; scan would be vacuous"; exit 1; }
          set +e
          MATCH=$(git grep -niE -f "$TOKENS" -- '*.go' 'go.mod' 'go.sum' '*/go.mod' '*/go.sum' ':!data/recog' ':!data/oui')
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "APOST-01: relocated-code residue found in the public tree:"
            printf '%s\n' "$MATCH"
            exit 1
          fi
          if [ "$RC" -ne 1 ]; then
            echo "APOST-01: git grep failed (exit $RC)"
            exit 1
          fi
          echo "APOST01_CLEAN"

  # Gate 8 — module-graph tidy-clean assertion (APOST-01, threat T-10-11).
  # After code is removed, `go mod tidy` must already have been run and
  # committed: a dependency (or go.sum hash) that only the removed code needed
  # would otherwise linger in the published module graph. Runs tidy on the CI
  # Go 1.27.x toolchain and reddens if go.mod or go.sum changes.
  go-mod-tidy:
    name: go.mod / go.sum tidy-clean
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Assert go mod tidy produces no drift
        run: |
          go mod tidy
          DRIFT=$(git status --porcelain go.mod go.sum)
          if [ -n "$DRIFT" ]; then
            echo "go.mod/go.sum are not tidy (commit the output of go mod tidy):"
            printf '%s\n' "$DRIFT"
            git diff -- go.mod go.sum
            exit 1
          fi
          echo "GOMOD_TIDY_CLEAN"

  # Gate 9 — govulncheck reachable-vulnerability scan (F1/F2).
  # Scans the module with the SAME toolchain that builds the release (setup-go
  # Go 1.27.x + check-latest), so standard-library CVEs in the shipped Go are
  # visible alongside dependency CVEs; a scan on an old pinned toolchain could
  # not show them. Default source mode: exit 3 on any vulnerability reachable
  # from the code reddens the job. GOOS is a matrix because x/sys and stdlib
  # vulnerabilities can be OS-specific. govulncheck is pinned by version
  # (v1.9.0), never @latest. No failure-suppression.
  govulncheck:
    name: govulncheck (reachable vulns, CI Go)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Install govulncheck (pinned v1.9.0)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Show toolchain
        run: go version

      - name: "govulncheck ./... (GOOS=${{ matrix.goos }})"
        env:
          GOOS: ${{ matrix.goos }}
        run: govulncheck ./...
