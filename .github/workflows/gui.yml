name: gui

# GUI blocking CI gates (D-17: macOS, Linux and Windows from the start). The
# current content is the Qt toolchain install spike: it proves the Qt toolchain
# installs on every runner the GUI will build on BEFORE any GUI gate depends on
# it. Plan 13-17 extends this workflow to the configure / build / qmllint /
# ctest / i18n / vocabulary gates. Modelled on ci-gates.yml (same triggers,
# checkout@v4, numbered gate headers, third-party tools pinned by commit SHA).
# No failure-suppression: every leg MUST redden the pipeline on failure, and
# NONE carries an allow-failure escape hatch.
on:
  pull_request:
  push:

jobs:
  # Gate G0 — Qt toolchain install spike (RESEARCH assumption A1, threat T-13-SC).
  # Proves the ship toolchain Qt 6.12.0 installs on every D-17 runner (macOS,
  # Linux, Windows) plus the 6.8.3 API floor on Linux (RESEARCH Qt Version
  # Decision). install-qt-action is pinned by full commit SHA. aqtinstall is
  # sourced from a pinned miurahr/aqtinstall commit, not PyPI: the newest PyPI
  # release (3.3.0) cannot read the per-toolchain Windows repository layout
  # Qt uses from 6.11 on (upstream issue #959, fixed by PR #1000 on master,
  # unreleased). The same pinned source serves every leg so one installer
  # version is exercised everywhere. Both the action and this git source were
  # approved by a human before first use. When aqtsource is set the action
  # ignores aqtversion, so aqtversion is deliberately not passed. The spike
  # uses no secrets and no write tokens. fail-fast is off so every leg reports
  # independently and one failure cannot mask another.
  qt-install-spike:
    name: "Qt ${{ matrix.qt }} install spike (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            qt: "6.12.0"
            arch: clang_64
          - os: ubuntu-24.04
            qt: "6.12.0"
            arch: linux_gcc_64
          - os: windows-2022
            qt: "6.12.0"
            arch: win64_msvc2022_64
          - os: ubuntu-24.04
            qt: "6.8.3"
            arch: linux_gcc_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt ${{ matrix.qt }} (${{ matrix.arch }})
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.arch }}
          # aqtinstall master 076e1659807d0b362a3ed684d54c2e9c775eb9c7 (2026-09-11),
          # contains PR #1000 (8c3695d4, Qt 6.11+ Windows repository layout).
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          cache: true

      - name: Print toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          if command -v qtpaths >/dev/null 2>&1; then
            echo "QT_VERSION=$(qtpaths --qt-version)"
          else
            echo "QT_VERSION=$(qmake -query QT_VERSION)"
          fi
          cmake --version
          if [ "$RUNNER_OS" = "Linux" ]; then
            lupdate -version
          fi

      - name: Sentinel
        shell: bash
        run: echo "QT_INSTALL_OK"
