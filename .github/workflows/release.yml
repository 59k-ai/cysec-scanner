name: release

# Windows release build. A pushed v* tag builds the engine and the Qt GUI on
# Windows, bundles them with the Qt runtime (windeployqt) and the MSVC runtime
# DLLs into one zip, and attaches it to a DRAFT GitHub release. A human checks
# the zip on a real Windows machine and publishes the draft by hand; nothing is
# published automatically. Tags with a pre-release suffix (v0.1.3-rc1) become
# pre-releases.
#
# Modelled on gui.yml (same Qt 6.12.0 ship toolchain, same pinned
# install-qt-action and aqtinstall source, Go 1.27.x with check-latest, every
# action pinned by full commit SHA, no failure-suppression). The build job has
# a read-only token; only the publish job may write, and it only creates the
# draft release from the uploaded artifact.
#
# The zip is NOT code-signed yet, so Windows SmartScreen warns on first run.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 bundle
    runs-on: windows-2022
    steps:
      - name: Disable CRLF conversion
        shell: bash
        run: git config --global core.autocrlf false

      # Full history: gui/CMakeLists.txt stamps the GUI version from
      # `git describe --tags`, which needs the tag in the clone.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version and paths
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          temp="$(cygpath -m "$RUNNER_TEMP")"
          echo "CYSEC_TAG=$tag" >> "$GITHUB_ENV"
          echo "CYSEC_DIST=$temp/cysec-scanner-$tag-windows-x64" >> "$GITHUB_ENV"
          echo "CYSEC_ZIP=$temp/cysec-scanner-$tag-windows-x64.zip" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Install Qt 6.12.0 (win64_msvc2022_64)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.12.0"
          arch: win64_msvc2022_64
          # aqtinstall master 076e1659807d0b362a3ed684d54c2e9c775eb9c7 (2026-09-11),
          # contains PR #1000 (8c3695d4, Qt 6.11+ Windows repository layout).
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          cache: true

      - name: Build the engine
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: |
          set -euo pipefail
          mkdir -p "$CYSEC_DIST"
          go build -trimpath -ldflags "-s -w -X main.version=$CYSEC_TAG" \
            -o "$CYSEC_DIST/cysec-scanner.exe" ./cmd/cysec-scanner

      - name: Build the GUI (Visual Studio 17 2022, Release)
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(cygpath -m "$QT_ROOT_DIR")"
          cmake -S gui -B gui/build -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_PREFIX_PATH="$prefix" -DCYSEC_GUI_BUILD_TESTS=OFF
          cmake --build gui/build --config Release --target cysec-scanner-gui --parallel

      - name: Assemble the bundle
        shell: bash
        run: |
          set -euo pipefail
          # Exactly one GUI executable must come out of the build.
          mapfile -t exes < <(find gui/build -path '*/Release/cysec-scanner-gui.exe')
          [ "${#exes[@]}" -eq 1 ] || { echo "expected one GUI exe, found: ${exes[*]:-none}"; exit 1; }
          cp "${exes[0]}" "$CYSEC_DIST/"

          # Qt runtime, QML imports and plugins next to the GUI.
          "$QT_ROOT_DIR/bin/windeployqt.exe" --release --no-compiler-runtime \
            --qmldir gui/app --qmldir gui/src \
            "$CYSEC_DIST/cysec-scanner-gui.exe"

          # App-local MSVC runtime, so the zip runs on a machine without the
          # Visual C++ redistributable installed.
          vs="$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)"
          crt="$(find "$(cygpath -u "$vs")/VC/Redist/MSVC" -type d -path '*/x64/Microsoft.VC14*.CRT' | sort | tail -n 1)"
          [ -n "$crt" ] || { echo "MSVC CRT redist directory not found"; exit 1; }
          cp "$crt"/*.dll "$CYSEC_DIST/"

          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md "$CYSEC_DIST/"

      # The engine must sit next to the GUI (the GUI never searches PATH) and
      # must report the tag it was built from.
      - name: Smoke-check the bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f "$CYSEC_DIST/cysec-scanner-gui.exe"
          test -f "$CYSEC_DIST/Qt6Core.dll"
          got="$("$CYSEC_DIST/cysec-scanner.exe" --version)"
          echo "engine --version: $got"
          case "$got" in *"$CYSEC_TAG"*) ;; *) echo "engine version does not match $CYSEC_TAG"; exit 1 ;; esac

      - name: Zip and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path $env:CYSEC_DIST -DestinationPath $env:CYSEC_ZIP
          $hash = (Get-FileHash -Algorithm SHA256 $env:CYSEC_ZIP).Hash.ToLower()
          $name = Split-Path -Leaf $env:CYSEC_ZIP
          "$hash  $name" | Out-File -Encoding ascii -NoNewline "$env:RUNNER_TEMP/SHA256SUMS"
          Get-Content "$env:RUNNER_TEMP/SHA256SUMS"

      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: |
            ${{ runner.temp }}/cysec-scanner-*-windows-x64.zip
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Draft GitHub release
    needs: build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: dist

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -la dist
          flags=(--draft --verify-tag --generate-notes --title "Cysec Scanner $TAG")
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" "${flags[@]}" dist/*
